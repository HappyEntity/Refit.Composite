name: CI (Build & Test)

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Lowest and highest Refit versions in the supported range.
                refit: [ '15.0.0', '16.*' ]

        name: Build & Test (Refit ${{ matrix.refit }})

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Restore dependencies
              run: dotnet restore -p:RefitTestVersion="${{ matrix.refit }}"

            - name: Build Solution
              run: dotnet build --configuration Release --no-restore -p:RefitTestVersion="${{ matrix.refit }}"

            - name: Run Tests
              run: dotnet test --configuration Release --no-build --verbosity normal
